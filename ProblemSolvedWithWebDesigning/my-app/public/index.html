<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Management | PostgreSQL + Node + Neon</title>
    <style>
      :root {
        --primary: #5b47fb;
        --primary-light: #f0eeff;
        --primary-dark: #4a3ac4;
        --secondary: #00cccc;
        --success: #2eca8b;
        --danger: #ff5b5b;
        --warning: #f7981c;
        --info: #1cb1f7;
        --dark: #2e384d;
        --light: #f5f7fb;
        --gray: #8e9cad;
        --white: #ffffff;
        --border: #e3e8f1;
        --shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.05);
        --shadow-lg: 0 1rem 2rem rgba(0, 0, 0, 0.1);
        --radius: 0.375rem;
        --radius-lg: 0.5rem;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        background-color: var(--light);
        color: var(--dark);
        line-height: 1.6;
        font-size: 0.9375rem;
        font-weight: 400;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 2rem;
      }

      .card {
        background: var(--white);
        width: 100%;
        max-width: 420px;
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-lg);
        border: 1px solid var(--border);
        overflow: hidden;
      }

      .card-header {
        padding: 1.5rem;
        border-bottom: 1px solid var(--border);
        background-color: var(--primary-light);
      }

      .card-title {
        font-size: 1.25rem;
        font-weight: 600;
        color: var(--primary);
        margin-bottom: 0.25rem;
        display: flex;
        align-items: center;
      }

      .card-title svg {
        margin-right: 0.75rem;
        width: 24px;
        height: 24px;
      }

      .card-subtitle {
        font-size: 0.8125rem;
        color: var(--gray);
      }

      .card-body {
        padding: 1.5rem;
      }

      .form-group {
        margin-bottom: 1.25rem;
      }

      .form-label {
        display: block;
        font-size: 0.8125rem;
        font-weight: 500;
        margin-bottom: 0.5rem;
        color: var(--dark);
      }

      .form-control {
        width: 100%;
        padding: 0.6875rem 1rem;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        font-size: 0.9375rem;
        transition: all 0.2s;
        background-color: var(--white);
        color: var(--dark);
      }

      .form-control:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 2px rgba(91, 71, 251, 0.2);
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-weight: 500;
        padding: 0.6875rem 1.5rem;
        border-radius: var(--radius);
        cursor: pointer;
        transition: all 0.2s;
        border: none;
        font-size: 0.9375rem;
      }

      .btn-block {
        display: flex;
        width: 100%;
      }

      .btn-primary {
        background-color: var(--primary);
        color: var(--white);
      }

      .btn-primary:hover {
        background-color: var(--primary-dark);
      }

      .section-title {
        font-size: 0.8125rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--gray);
        margin: 1.5rem 0 1rem;
        display: flex;
        align-items: center;
      }

      .section-title::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--border);
        margin-left: 1rem;
      }

      .list-group {
        list-style: none;
      }

      .list-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0.875rem 1rem;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        margin-bottom: 0.75rem;
        background-color: var(--white);
        transition: all 0.2s;
      }

      .list-item:hover {
        border-color: var(--primary);
      }

      .list-item-content {
        display: flex;
        flex-direction: column;
      }

      .list-item-name {
        font-weight: 500;
        color: var(--dark);
        margin-bottom: 0.25rem;
      }

      .list-item-email {
        font-size: 0.8125rem;
        color: var(--gray);
      }

      .empty-state {
        text-align: center;
        padding: 2rem 1rem;
        color: var(--gray);
      }

      .empty-state svg {
        width: 48px;
        height: 48px;
        margin-bottom: 1rem;
        color: var(--border);
      }

      .empty-state p {
        margin-bottom: 0.5rem;
      }

      /* Simple icon replacements using Unicode */
      .icon {
        font-style: normal;
      }

      @media (max-width: 480px) {
        body {
          padding: 1rem;
        }

        .card-header,
        .card-body {
          padding: 1.25rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="card-header">
        <h2 class="card-title">
          Contact Management
        </h2>
        <p class="card-subtitle">
          Add contacts to your database and manage them easily
        </p>
      </div>

      <div class="card-body">
        <form id="userForm">
          <div class="form-group">
            <label for="name" class="form-label">Full Name</label>
            <input
              type="text"
              id="name"
              class="form-control"
              placeholder="Enter full name"
              required
            />
          </div>

          <div class="form-group">
            <label for="email" class="form-label">Email Address</label>
            <input
              type="email"
              id="email"
              class="form-control"
              placeholder="Enter email address"
              required
            />
          </div>

          <button type="submit" class="btn btn-primary btn-block">
            <span class="icon">➕</span> &nbsp;Add Contact
          </button>
        </form>

        <h3 class="section-title">
          Recent Contacts
        </h3>

        <ul class="list-group" id="users">
        </ul>
      </div>
    </div>

    <script>
      const apiBase = "/api/users";

      async function loadUsers() {
        const res = await fetch(apiBase);
        const data = await res.json();
        const ul = document.getElementById("users");
        ul.innerHTML = "";
        data.forEach((u) => {
          const li = document.createElement("li");
          li.textContent = `${u.name} - ${u.email}`;
          ul.appendChild(li);
        });
      }

      document
        .getElementById("userForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const name = document.getElementById("name").value;
          const email = document.getElementById("email").value;
          await fetch(apiBase, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name, email }),
          });
          document.getElementById("name").value = "";
          document.getElementById("email").value = "";
          loadUsers();
        });

      loadUsers();
    </script>
  </body>
</html>
